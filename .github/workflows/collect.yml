name: collect-photos
on:
  push:
    paths: ["keywords.txt", "collect.py", ".github/workflows/collect.yml"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - run: python collect.py
        env: { PER: "6", MAXSEC: "18000" }
      - run: |
          git config user.name "photo-bot"
          git config user.email "photo-bot@users.noreply.github.com"
          git add -A images meta.json
          git commit -m "photos: add collected public-domain images [skip ci]" || echo "nothing new"
          git pull --rebase || true
          git push
